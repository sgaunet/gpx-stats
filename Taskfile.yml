# https://taskfile.dev
version: '3'
includes:
  dev: ./Taskfile_dev.yml

vars:
  BINFILE: gpx-stats

tasks:
  default:
    desc: "List all tasks"
    preconditions:
      - sh: test -f .git/hooks/pre-commit
        msg: "Pre-commit hook not found. Please run 'pre-commit install' to set it up."
    cmds:
      - task -a

  check-before-commit:
    desc: "Run checks before committing"
    preconditions:
      - test -f .git/hooks/pre-commit
    deps:
      - test
      - snapshot
    cmds:
      - task: lint

  lint:
    desc: "Run linter"
    cmds:
      - go generate ./...
      - golangci-lint run

  test:
    desc: "Run unit tests with race detection"
    cmds:
      - go test -count=2 -race ./...

  coverage:
    desc: "Generate coverage report"
    cmds:
      - go test -coverpkg=./... -coverprofile=profile.cov ./...
      - |
        if [ "$(uname)" = "Darwin" ]; then
          sed -i '' '/cmd/d' profile.cov
        else
          sed -i '/cmd/d' profile.cov
        fi
      - go tool cover -func profile.cov | grep '^total:' | awk '{print $3}' | sed "s/%//"
      - rm -f profile.cov

  build:
    desc: "Build binary"
    cmds:
      - CGO_ENABLED=0 go build -o {{.BINFILE}} ./cmd/gpx-stats

  demo:
    desc: "Record doc/demo.gif with VHS"
    deps:
      - build
    cmds:
      - vhs doc/demo.tape


  image:
    desc: "Build and push Docker image"
    cmds:
      # Dockerfile now copies from $TARGETPLATFORM/ (dockers_v2 layout); stage the
      # linux/amd64 binary into a small, git-ignored build context under dist/.
      - rm -rf dist/imgctx && mkdir -p dist/imgctx/linux/amd64
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/imgctx/linux/amd64/{{.BINFILE}} ./cmd/gpx-stats
      - docker build --no-cache --platform linux/amd64 -f Dockerfile -t ghcr.io/sgaunet/gpx-stats/gpx-stats:latest dist/imgctx
      - docker push ghcr.io/sgaunet/gpx-stats/gpx-stats:latest


  snapshot:
    desc: "Create a snapshot"
    cmds:
      - GITLAB_TOKEN="" GITEA_TOKEN="" goreleaser --clean --snapshot

  release:
    desc: "Create a release"
    cmds:
      - goreleaser --clean

  godoc:
    desc: "Go documentation of gpx-stats"
    cmds:
      - go doc -http -c github.com/sgaunet/gpx-stats
